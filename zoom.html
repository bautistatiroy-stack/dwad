<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #6c036f;
            font-family: Arial, sans-serif;
        }
        /* =========================
   LOGIN BOX
========================= */
        
        .login-box {
            width: 330px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
            text-align: center;
        }
        /* =========================
   LOGO
========================= */
        
        .logo {
            width: 80px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            transition: transform .3s;
        }
        /* =========================
   TITLE
========================= */
        
        h2 {
            color: #8200a3;
            margin-bottom: 20px;
        }
        /* =========================
   INPUT
========================= */
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }
        
        input:focus {
            border-color: #8200a3;
        }
        /* =========================
   LOGIN BUTTON
========================= */
        
        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #8200a3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .login-btn:hover {
            background: #650080;
        }
        /* =========================
   ERROR
========================= */
        
        #error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }
        /* =========================
   ZOOM ANIMATION
========================= */
        
        .logo.zoom {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 100px;
            height: 150px;
            margin: 0;
            border-radius: 50% 50%;
            z-index: 9999;
            transform: translate(-50%, -50%) scale(1);
            animation: logoZoom 1s cubic-bezier(.65, 0, .35, 1) forwards;
        }
        /* =========================
   ZOOM KEYFRAMES
========================= */
        
        @keyframes logoZoom {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            10% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 1;
            }
            20% {
                transform: translate(-50%, -50%) scale(5);
                opacity: 1;
            }
            30% {
                transform: translate(-50%, -50%) scale(12);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(30);
                opacity: 0;
            }
        }
    </style>
</head>


<body>


    <div class="login-box">

        <!-- YOUR LOGO -->

        <img src="logo.png" id="logo" class="logo" alt="Logo">


        <h2>Login</h2>


        <input type="text" id="username" placeholder="Username">


        <input type="password" id="password" placeholder="Password">


        <button class="login-btn" onclick="login()">
        Login
    </button>


        <p id="error"></p>

    </div>



    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzw18cFASV8ni2apNYYMQgnh1Sh61SyRPCr_iBNpCzl6rwx2PDVwKDj9j4mCh_0v4aCqg/exec";

        async function login() {

            let user = document.getElementById("username").value.trim();
            let pass = document.getElementById("password").value;

            const email = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            // Check if fields are empty
            if (!email && !password) {
                document.getElementById("error").textContent =
                    "Please enter your email and password befor you login.";
                return;
            }

            if (!email) {
                document.getElementById("error").textContent =
                    "Please enter your email.";
                return;
            }

            if (!password) {
                document.getElementById("error").textContent =
                    "Please enter your password.";
                return;
            }

            document.getElementById("error").textContent = "";

            try {

                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "login",
                        username: user,
                        password: pass,

                    })
                });

                const result = await response.json();
                //*for blacking 
                if (result.success) {

                    sessionStorage.setItem("adminLogin", "true");
                    sessionStorage.setItem("token", result.token);

                    window.location.href = "dashboard.html";

                } else {

                    document.getElementById("error").textContent =
                        result.message;

                }
                //*

                if (result.success) {



                    alert("Login Successful");

                } else {

                    alert(result.message);
                    if (!result.success) {

                        alert(result.message);
                    }
                }

            } catch (err) {

                console.log(err);
                alert("Login failed.");

            }
        }
    </script>
