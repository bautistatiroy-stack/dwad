<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #32012b;
        }
        /* LOGIN BOX */
        
        .login-box {
            width: 100%;
            max-width: 4000px;
            padding: 100px 100px;
            background: rgb(105, 4, 100);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        /* LOGO */
        
        .Logo {
            width: 70px;
            height: 70px;
            padding: 6px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 50%;
            background: linear-gradient(45deg, #560849, #da9d03);
            object-fit: contain;
            transition: 0.3s;
        }
        
        .Logo:hover {
            transform: scale(1.08);
        }
        /* TITLE */
        
        .login-box h2 {
            margin-bottom: 20px;
            color: #fffefd;
        }
        /* INPUTS */
        
        .login-box input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background-color: #9a4b8d;
            color: aliceblue;
        }
        
        .login-box input:focus {
            border-color: #ea580c;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
        }
        /* BUTTONS */
        
        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .login-btn {
            background: linear-gradient(45deg, #ea580c, #fb923c);
            color: white;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 179, 0.3);
        }
        
        .back-btn {
            background: #f3f4f6;
            color: #333;
        }
        
        .back-btn:hover {
            background: #e5e7eb;
        }
        /* ERROR */
        
        #error {
            color: red;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }
        /* MOBILE */
        
        @media (max-width: 500px) {
            .login-box {
                padding: 20px 15px;
                box-shadow: #7d4242;
            }
            .login-box:hover {
                padding: 50px 100px;
                background-color: #9a4b8d;
            }
            .login-box input :hover {
                width: 100%;
                padding: 20px 15px;
                margin-bottom: 15px;
                border: 1px solid #ddd;
                border-radius: 10px;
                outline: none;
                font-size: 15px;
                transition: 0.3s;
                background-color: #9a4b8d;
                color: aliceblue;
            }
            .Logo {
                width: 100px;
                height: 100px;
            }
            .Logo:hover {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img class="Logo" src="logo.png" alt="Logo">

        <h2>Customer Relationship Management</h2>

        <input type="text" id="adminUser" placeholder="Username">

        <input type="password" id="adminPass" placeholder="Password">

        <button class="login-btn" onclick="loginAdmin()">
            Login
        </button>

        <button class="back-btn" onclick="goShop()">
            Back
        </button>

        <div id="error"></div>

    </div>


    <script>
        /*
                                                                                                                                                        ==========================================
                                                                                                                                                        ADMIN LOGIN
                                                                                                                                                        ==========================================
                                                                                                                                                        */

        function loginAdmin() {

            const username =
                document.getElementById("adminUser").value.trim();

            const password =
                document.getElementById("adminPass").value;

            const error =
                document.getElementById("error");


            // Clear previous error
            error.textContent = "";


            // Check empty fields
            if (username === "" || password === "") {

                error.textContent =
                    "Please enter username and password.";

                return;
            }


            /*
            ======================================
            DEMO LOGIN
            ======================================

            Change these credentials to your own.
            ======================================
            */

            const ADMIN_USERNAME = "admin";
            const ADMIN_PASSWORD = "123456";


            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                // Save login status
                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );

                // Go to admin dashboard
                window.location.href = "admin.html";

            } else {

                error.textContent =
                    "Invalid username or password.";

            }
        }


        /*
        ==========================================
        BACK TO SHOP
        ==========================================
        */

        function goShop() {

            window.location.href = "shop.html";

        }


        /*
        ==========================================
        ENTER KEY LOGIN
        ==========================================
        */

        document
            .getElementById("adminPass")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    loginAdmin();

                }

            });
    </script>

</body>

</html>
